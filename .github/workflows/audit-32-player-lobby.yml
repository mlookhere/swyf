name: Audit 32-player lobby dependencies

on:
  push:
    branches:
      - audit/32-player-lobby
    paths:
      - 'tools/audit_lobby.py'
      - 'tools/LobbyPatcher/**'
      - '.github/workflows/audit-32-player-lobby.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inspect compiled Unity game networking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ILSpy command-line decompiler
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Decompile game-owned assemblies to temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          root="Scam With Your Friends_Data/Managed"
          for name in Assembly-CSharp ScriptsAssDef; do
            test -s "$root/$name.dll"
            mkdir -p "$RUNNER_TEMP/swyf-audit/$name"
            ilspycmd -p -o "$RUNNER_TEMP/swyf-audit/$name" "$root/$name.dll"
          done
      - name: Report lobby limit and networking references
        shell: bash
        run: |
          python3 tools/audit_lobby.py "$RUNNER_TEMP/swyf-audit" "$RUNNER_TEMP/lobby-audit.md"
      - name: Examine host-limit implementation and settings paths
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "swyf-audit"
          sections = {
              "ScriptsAssDef/MaxLobbySizeSetting.cs": [(1, 330)],
              "ScriptsAssDef/SteamCreateLobbyForServer.cs": [(245, 290), (340, 385), (440, 485)],
              "ScriptsAssDef/DeveloperSpectatorNetworkManager.cs": [(30, 85)],
              "ScriptsAssDef/MetaFizzySteamworks.cs": [(432, 460), (1217, 1245)],
          }
          for rel, ranges in sections.items():
              path = root / rel
              if not path.is_file():
                  print(f"Missing file: {rel}")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              for start, end in ranges:
                  print(f"====== {rel}:{start}-{end} ======")
                  for n in range(start, min(end, len(lines)) + 1):
                      print(f"{n}: {lines[n-1]}")
          PY
      - name: Scan remaining eight-player assumptions and UI bindings
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "swyf-audit"
          hints = re.compile(r"lobby|player|join|spawn|network|steam|roster|capacity|desk|seat|voice", re.I)
          hardcoded = re.compile(r"(?<!\d)8(?!\d)|MaxLobbySizeSetting|LobbySizeOptionCount|GetSelectedIndex", re.I)
          paths = sorted(root.rglob("*.cs"))
          hits = []
          for file in paths:
              if file.stem.endswith(("Test", "Example")):
                  continue
              lines = file.read_text(encoding="utf-8", errors="replace").splitlines()
              for n, line in enumerate(lines):
                  if not hardcoded.search(line):
                      continue
                  neighbors = " ".join(lines[max(0,n-2):min(len(lines),n+3)])
                  if hints.search(line) or (hints.search(file.stem) and hints.search(neighbors)):
                      hits.append((file.relative_to(root), n + 1, line.strip()[:220]))
          print("Potential remaining 8-player/UI binding references:", len(hits))
          for path, number, line in hits[:220]:
              print(f"{path}:{number}: {line}")
          if len(hits) > 220:
              print("...remaining references omitted from console; inspect decompilation locally for full coverage")
          PY
      - name: Build and test reversible 32-player patcher
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/LobbyPatcher/LobbyPatcher.csproj -c Release
          game="$RUNNER_TEMP/swyf-patch-test"
          managed="$game/Scam With Your Friends_Data/Managed"
          mkdir -p "$managed"
          cp "Scam With Your Friends_Data/Managed/"*.dll "$managed/"
          dotnet run --no-build -c Release --project tools/LobbyPatcher -- --inspect "$game"
          dotnet run --no-build -c Release --project tools/LobbyPatcher -- --apply "$game"
          dotnet run --no-build -c Release --project tools/LobbyPatcher -- --verify "$game"
          cmp "Scam With Your Friends_Data/Managed/ScriptsAssDef.dll" "$managed/ScriptsAssDef.dll.before-32-player-patch.bak"
          ilspycmd -p -o "$RUNNER_TEMP/swyf-patched-decompiled" "$managed/ScriptsAssDef.dll"
          python3 - "$RUNNER_TEMP/swyf-patched-decompiled" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          setting = (root / "MaxLobbySizeSetting.cs").read_text()
          steam = (root / "SteamCreateLobbyForServer.cs").read_text()
          assert "MaximumLobbySize = 32" in setting
          assert "Mathf.Clamp(lobbySize, 1, 32)" in setting
          assert 'GetInt("HostSettings.MaxLobbySize"), 1, 32' in setting
          assert "Mathf.Clamp(value, 1, 32)" in steam
          print("Verified patched decompilation has 32-person caps.")
          PY
          dotnet run --no-build -c Release --project tools/LobbyPatcher -- --restore "$game"
          cmp "Scam With Your Friends_Data/Managed/ScriptsAssDef.dll" "$managed/ScriptsAssDef.dll"
      - name: Build Windows patcher utility (not vendor DLL)
        shell: bash
        run: |
          dotnet publish tools/LobbyPatcher/LobbyPatcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/swyf-patcher-windows"
      - name: Upload Windows patch utility
        uses: actions/upload-artifact@v4
        with:
          name: swyf-lobby-patcher-win-x64
          path: ${{ runner.temp }}/swyf-patcher-windows/
          retention-days: 7
      - name: Upload inspection report (no decompiled source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swyf-32-player-audit
          path: ${{ runner.temp }}/lobby-audit.md
          if-no-files-found: warn
          retention-days: 7
